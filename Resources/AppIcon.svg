<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Tunnels app icon: three arches receding into the tunnel, brightest
       nearest, on a near-black tile. macOS masks the tile to its squircle; the
       inset keeps the artwork inside the mask like Apple's own icons. -->
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#232326"/>
      <stop offset="1" stop-color="#0E0E10"/>
    </radialGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <g fill="none" stroke="#2ECC71" stroke-linecap="round" stroke-width="68">
    <path d="M254 716 V562 a258 258 0 0 1 516 0 V716" opacity="0.42"/>
    <path d="M357 716 V582 a155 155 0 0 1 310 0 V716" opacity="0.72"/>
    <path d="M460 716 V602 a52 52 0 0 1 104 0 V716"/>
  </g>
</svg>
