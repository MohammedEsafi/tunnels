name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: swift --version && xcodebuild -version

      - name: Cache build
        uses: actions/cache@v6
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift') }}

      - name: Build (warnings are errors)
        run: swift build -Xswiftc -warnings-as-errors

      - name: Test
        run: swift test

      - name: Format
        run: xcrun swift-format lint --strict --recursive Sources Tests

      - name: Shell scripts
        run: |
          brew install shellcheck
          shellcheck scripts/*.sh simulation/*.sh simulation/machines

      - name: Bundle
        run: scripts/bundle.sh

      - name: Verify bundle
        run: |
          codesign --verify --deep --strict build/Tunnels.app
          plutil -lint build/Tunnels.app/Contents/Info.plist

      - uses: actions/upload-artifact@v7
        with:
          name: Tunnels.app
          path: build/Tunnels.app
